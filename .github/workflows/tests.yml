name: synthetic-installation-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@98e3b21a1c45e26529208849ec20e5cfb7086040 # v2
        with:
          version: '25.10.7'
      - run: python -m pip install -r requirements.txt -r requirements-docs.txt
      - run: python -m pip install -r sv_signatures/requirements-clustersv.lock.txt
      - run: sudo apt-get update && sudo apt-get install -y samtools bcftools r-base r-cran-gtools r-cran-doparallel r-cran-r.utils r-cran-nmf r-cran-jsonlite
      - run: python scripts/test_installation.py
      - run: python scripts/audit_publication.py
      - run: python scripts/workflow.py test --profile test
      - run: python scripts/test_main_stub.py --out results/ci-main-stub
      - run: python scripts/test_main_stub.py --out results/ci-region-stub --with-exclusions
      - run: python sv_signatures/pcawg/prepare_sources.py --clustersv-only
      - run: python sv_signatures/pcawg/test_clustersv.py --pipeline-root "$PWD" --clustering-only --rscript Rscript
      - run: Rscript sv_signatures/pcawg/test_numerics.R "$PWD"
      - run: python sv_signatures/pcawg/test_nmf_exports.py
      - run: python scripts/test_clustersv_workflow.py --out results/ci-clustersv-nmf
      - run: python scripts/build_docs.py

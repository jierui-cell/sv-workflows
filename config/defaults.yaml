# Defaults are versioned. Use a private YAML overlay; do not edit this file per cohort.
container_engine: apptainer
modules_samtools: null
modules_bcftools: null
modules_calling: null
scheduler_options: ''
max_parallel_preflight: 3
compact_publish: false
input: examples/samplesheet.tsv
dataset_id: YOUR_DATASET_ID
reference: /path/to/reference.fa
outdir: results/my_run
callers: preflight
# Pilot cap. Override for cohort batches after measuring storage/resource limits.
max_parallel_callers: 3
delly:
  image: /path/to/delly-2.6.0--h3752d28_0.sif
  cpus: 8
  memory_gb: 64
  time: 24h
  options: {map_qual: 1, minclip: 25, mad_cutoff: 9}
  filter_options: {quality: 300, altaf: 0.03, coverage: 10, controlcont: 0}
svaba:
  image: /path/to/svaba-1.2.0--h69ac913_1.sif
  cpus: 8
  memory_gb: 64
  time: 24h
  options: {mate_lookup_min: 3, chunk_size: 25000, max_reads: 50000, max_coverage: 500}
gridss:
  somatic_filter: true
  somatic_filter_options: {allowable_normal_contamination: 0.03, min_normal_depth: 8, min_direct_read_support: 1, min_af: 0.005, min_qual: 350, max_homology_length: 50, max_inexact_homology_length: 50}
  image: /path/to/gridss-2.13.2--h96c455f_6.sif
  cpus: 8
  memory_gb: 96
  time: 24h
  jvmheap_gb: 40
  otherjvmheap_gb: 4
  options: {}
brass:
  image: /path/to/brass-v6.3.4.sif
  cpus: 8
  memory_gb: 64
  time: 24h
  bundle: /path/to/validated-brass-bundle
  missing_statistics_policy: native_defaults
  min_group: 2
  min_cn_change: 0.3
  species: HUMAN
  assembly: GRCh37
  protocol: WGS
  platform: ILLUMINA
lumpy:
  cpus: 4
  memory_gb: 48
  time: 30h
  genotype_workers: 4
  shared_tmp: /path/to/approved-large-scratch
  filter_policy: config/lumpy-research-filter.json
  pilot_pair_ids: [] # Historical adapter retained in source only; launch is disabled.
cue:
  image: /path/to/cue-python-3.7.17-bullseye.sif
  python: /path/to/cue-py37/bin/python
  source: /path/to/pinned-cue-source
  source_commit: PINNED_COMMIT
  model: /path/to/cue.v2.pt
  cpus: 2
  memory_gb: 64
  time: 36h
  pair_execution: sequential
  comparison_config: config/cue-pair-comparison.yaml
  bam_screen_config: config/cue-bam-screen.yaml
  data_options:
    chr_names: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrY]
    logging_level: INFO
    min_sv_len: 4000
    min_qual_score: 50
    refine_disable: false
  model_options: {gpu_ids: [], n_jobs_per_gpu: 1, n_cpus: 2, batch_size: 16, report_interval: 100}
# JaBbA is graph inference from precomputed junctions and corrected coverage.
# Its incremental runtime is not comparable to BAM-to-VCF callers without upstream costs.
jabba:
  inputs: /path/to/jabba_inputs.tsv
  image: /path/to/jabba-0.0.2.sif
  r_lib: /path/to/private/jabba-r-library
  solver: cplex # or gurobi; use a licensed installation and test it first
  cplex_dir: /path/to/CPLEX_Studio2220
  coverage_mode: generate
  fragcounter_image: /path/to/fragcounter-0.3.sif
  cbs_image: /path/to/pinned-cbs.sif
  cbs_source_commit: 287c27648caa0ae05bb613e6adba7066f5ba17c2
  gcmap_dir: /path/to/hg19/gcmap
  coverage_cpus: 4
  coverage_memory_gb: 96
  coverage_time: 36h
  max_parallel_coverage: 1
  coverage_options: {window: 1000, minmapq: 20, cnsignif: 0.00001}
  upstream_junction_caller: svaba
  coverage_method: fragCounter-corrected-tumor-normal-ratio-1kb
  cpus: 12
  subgraph_cores: 1 # upstream JaBbA's --cores; optimizer uses 12 threads per subgraph
  solver_threads: 12 # pinned upstream default; fail if the requested allocation is too small
  memory_gb: 64
  time: 24h
  use_metadata_purity_ploidy: false
  options: {field: ratio, ppmethod: ppgrid, slack: 100, tilim: 6000, epgap: 0.00001, iterate: 0, cnsignif: 0.00001}
pair_ids: ""
slurm_account: null
slurm_partition: null
manta_image: /path/to/manta-1.6.0--py27h9948957_6.sif
manta_cpus: 8
manta_memory_gb: 64
manta_time: 24h
manta_workflow_memory_gb: 56
manta_options:
  minCandidateVariantSize: 8
  minEdgeObservations: 3
  graphNodeMaxEdgeCount: 10
  minCandidateSpanningCount: 3
  minScoredVariantSize: 50
  minSomaticScore: 10
  minPassSomaticScore: 30
  enableRemoteReadRetrievalForInsertionsInCancerCallingModes: 0
  useOverlapPairEvidence: 0
  enableEvidenceSignalFilter: 1

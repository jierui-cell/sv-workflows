# Defaults are versioned. Use a private YAML overlay; do not edit this file per cohort.
container_engine: apptainer
modules: []  # Loaded automatically for the driver and every compute task.
genome_build: GRCh37
sequencing_type: WGS  # WGS | WES | targeted; capture assays currently use Manta.
target_bed: null  # Optional WES / required targeted inclusion BED, 0-based half-open.
# Explicitly acknowledged by --allow-local; do not use to run on login nodes.
allow_local_execution: false
# Optional 0-based BED exclusion list; null preserves the original unmasked baseline.
exclude_bed: null
modules_samtools: null
modules_bcftools: null
modules_calling: null
scheduler_options: ''
max_parallel_preflight: 3
compact_publish: false
input: inputs/samplesheet.tsv
dataset_id: my_cohort
reference: resources/reference/reference.fa
outdir: results/my_run
callers: preflight
# Concurrent pairs per caller; override to match your scheduler allocation.
max_parallel_callers: 3
delly:
  image: containers/images/delly-2.6.0--h3752d28_0.sif
  cpus: 8
  memory_gb: 64
  time: 24h
  options: {map_qual: 1, minclip: 25, mad_cutoff: 9}
  filter_options: {quality: 300, altaf: 0.03, coverage: 10, controlcont: 0}
svaba:
  image: containers/images/svaba-1.2.0--h69ac913_1.sif
  cpus: 8
  memory_gb: 64
  time: 24h
  options: {mate_lookup_min: 3, chunk_size: 25000, max_reads: 50000, max_coverage: 500}
gridss:
  somatic_filter: true
  somatic_filter_options: {allowable_normal_contamination: 0.03, min_normal_depth: 8, min_direct_read_support: 1, min_af: 0.005, min_qual: 350, max_homology_length: 50, max_inexact_homology_length: 50}
  image: containers/images/gridss-2.13.2--h96c455f_6.sif
  cpus: 8
  memory_gb: 96
  time: 24h
  jvmheap_gb: 40
  otherjvmheap_gb: 4
  options: {}
brass:
  image: containers/images/brass-v6.3.4.sif
  cpus: 8
  memory_gb: 64
  time: 24h
  # Extra annotations/masks/microbial resources, NOT another human FASTA.
  # Create once: python scripts/setup_brass.py
  bundle: resources/brass/bundle
  missing_statistics_policy: native_defaults
  min_group: 2
  min_cn_change: 0.3
  species: HUMAN
  assembly: GRCh37
  protocol: WGS
  platform: ILLUMINA
pair_ids: ""
slurm_account: null
slurm_partition: null
manta_image: containers/images/manta-1.6.0--py27h9948957_6.sif
manta_cpus: 8
manta_memory_gb: 64
manta_time: 24h
manta_workflow_memory_gb: 56
manta_options:
  minCandidateVariantSize: 8
  minEdgeObservations: 3
  graphNodeMaxEdgeCount: 10
  minCandidateSpanningCount: 3
  minScoredVariantSize: 50
  minSomaticScore: 10
  minPassSomaticScore: 30
  enableRemoteReadRetrievalForInsertionsInCancerCallingModes: 0
  useOverlapPairEvidence: 0
  enableEvidenceSignalFilter: 1

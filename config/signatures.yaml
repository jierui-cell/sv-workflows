# Use scripts/workflow.py signatures with a private overlay from examples/signatures.yaml.
method: cosmic_sv32  # cosmic_sv32 | pcawg_clustersv
genome_build: GRCh37
sequencing_type: WGS
manifest: /path/to/private/sv_manifest.tsv
outdir: ''  # Default: results/sv_signatures_corrected OR results/sv_signatures_pcawg
python: sv_signatures/.venv/bin/python
groups: all  # Or melanoma:manta,pnet:manta
pair_id: ''
pair_ids: ''
min_size_bp: 1000  # COSMIC intrachromosomal minimum
cosmic_version: 3.6
skip_fit: false
pcawg_stage: signatures  # clustering | features | signatures (CN-free de novo NMF).
pcawg_rank_min: 2
pcawg_rank_max: 10
pcawg_rank: 0  # 0 selects from the rank survey; >=2 fixes the rank.
pcawg_nrun: 100
pcawg_seed: 1234
pcawg_nmf_epsilon: 2.220446049250313e-16
pcawg_nmf_max_iter: 2000
pcawg_min_size_bp: 1  # Preserve short junctions relevant to complex events
pcawg_timing_source: reference  # Verified fixed-tertile reference is required by the supported route.
pcawg_timing_reference: resources/replication_timing/pcawg_mean_tertiles
pcawg_fdr_first: 0.01
pcawg_fdr_final: 0.05
pcawg_footprint_fdr: 0.01
pcawg_mask_policy: local_cen_telo_exclusion  # Local filtering, not upstream ClusterSV behavior.
account: null
partition: null
scheduler_options: ''
clustersv_source: resources/clustersv/source
pcawg_rscript: sv_signatures/pcawg/Rscript.sh
max_parallel_groups: 4
group_cpus: 4
group_memory_gb: 32
group_time: 4h
